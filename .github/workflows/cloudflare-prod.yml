name: Cloudflare Prod

on:
  workflow_dispatch:
  push:
    tags:
      - "prod-*"

permissions:
  contents: read

concurrency:
  group: cloudflare-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-fund --no-audit
      - run: npm test

      - name: Check deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PRD }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Repository Actions secret CLOUDFLARE_API_TOKEN is missing. Create a token with Cloudflare Pages + Workers edit on account 8a8c9483df8e8a2a9adec437a0994fe4. Agents often lack actions:write and cannot add this secret."
            exit 1
          fi
          if [ -z "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}" ] || [ -z "${CLERK_SECRET_KEY:-}" ]; then
            echo "::error::Repository Actions secrets NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRD and CLERK_SECRET_KEY_PRD are required for production deploys."
            exit 1
          fi
          echo "Deploy secrets are present (values not printed)."

      - name: Build Next.js with /aegisflow basePath
        run: npm run build
        env:
          CLOUDFLARE_PROD: "true"
          BASE_PATH: /aegisflow
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PRD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

      - name: Confirm /aegisflow and Clerk publishable key are inlined
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRD }}
        run: |
          set -euo pipefail
          if ! grep -R -F -q "/aegisflow" .next; then
            echo "::error::Built site does not contain /aegisflow. BASE_PATH was not applied."
            exit 1
          fi
          echo "basePath /aegisflow is present in the Next.js build."
          # Client + middleware need the publishable key inlined; do not print it.
          case "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" in
            pk_test_*|pk_live_*) ;;
            *)
              echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRD must start with pk_test_ or pk_live_."
              exit 1
              ;;
          esac
          if ! grep -R -E -q --binary-files=without-match 'pk_(test|live)_' .next; then
            echo "::error::Publishable Clerk key was not inlined into the Next.js build."
            exit 1
          fi
          echo "Clerk publishable key prefix is present in the Next.js build."

      - name: OpenNext Cloudflare adapter
        run: npx opennextjs-cloudflare build
        env:
          CLOUDFLARE_PROD: "true"
          BASE_PATH: /aegisflow
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRD }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PRD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

      - name: Deploy OpenNext Worker (project aegisflow)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8a8c9483df8e8a2a9adec437a0994fe4' }}
          # Ingest Worker secrets (Jaime must create GitHub Actions secrets):
          #   FIRMS_MAP_KEY  — NASA FIRMS MAP key
          #   GCP_SA_JSON    — service-account JSON for GCP project aegisflow-ieee-quest
          # These are uploaded as Wrangler secrets on Worker `aegisflow`. Empty is OK;
          # adapters then serve AegisFire-01 fixtures and FeedBanner stays quiet.
          # Optional: `npx wrangler secret put FIRMS_MAP_KEY` / `npx wrangler secret put GCP_SA_JSON`
          command: deploy
          secrets: |
            CLERK_SECRET_KEY
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            FIRMS_MAP_KEY
            GCP_SA_JSON
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_PRD }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRD }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}

      - name: Deploy path Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '8a8c9483df8e8a2a9adec437a0994fe4' }}
          command: deploy --config workers/aegisflow-path/wrangler.jsonc
